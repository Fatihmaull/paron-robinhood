[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.37"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
auto_detect_solc = true
fs_permissions = [
    { access = "read", path = "../config" },
    { access = "read-write", path = "../deployments" },
]
no_match_path = "test/fork/**"
fuzz = { runs = 256 }
invariant = { runs = 32, depth = 16, fail_on_revert = false }

[profile.ci]
fuzz = { runs = 64 }
invariant = { runs = 16, depth = 8, fail_on_revert = false }

[profile.deep]
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 64, fail_on_revert = false }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
