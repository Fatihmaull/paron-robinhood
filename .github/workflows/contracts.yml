name: contracts

on:
  push:
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - run: npm ci
      - run: forge test
